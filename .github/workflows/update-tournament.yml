name: Update Tournament Feed

# Match-aware live updater for tournament2026.json.
# Runs frequently, but the script itself decides whether to call the API
# (see scripts/update_tournament.mjs) so we stay inside the free tier.

on:
  schedule:
    # Every 5 minutes (GitHub's minimum; runs may be delayed under load).
    - cron: "*/5 * * * *"
  workflow_dispatch: {}   # allow manual runs from the Actions tab

# Prevent overlapping runs from racing on the commit.
concurrency:
  group: update-tournament
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run updater
        env:
          FOOTBALL_DATA_TOKEN: ${{ secrets.FOOTBALL_DATA_TOKEN }}
          WC_COMPETITION: "WC"   # football-data.org FIFA World Cup code
          WC_SEASON: "2026"
          DAILY_CALL_CAP: "95"
        run: node scripts/update_tournament.mjs

      - name: Commit changes
        run: |
          if [[ -n "$(git status --porcelain tournament2026.json scripts/.tournament-state.json)" ]]; then
            git config user.name "tournament-bot"
            git config user.email "bot@users.noreply.github.com"
            git add tournament2026.json scripts/.tournament-state.json
            git commit -m "chore: update live tournament feed [skip ci]"
            git push
          else
            echo "No changes to commit."
          fi
