name: Update Tournament Feed

# Match-aware live updater for tournament2026.json.
# Runs frequently, but the script itself decides whether to call the API
# (see scripts/update_tournament.mjs) so we stay inside the free tier.

on:
  schedule:
    # Two offset schedules, each firing every 5 minutes but staggered 2.5 min apart.
    # Net effect: a job starts roughly every 2–3 minutes, covering the full window.
    # Each job's inner loop runs ~2 min, so jobs complete well before the next fires.
    - cron: "0,5,10,15,20,25,30,35,40,45,50,55 * * * *"   # on the 5-min marks
    - cron: "2,7,12,17,22,27,32,37,42,47,52,57 * * * *"   # offset +2 min
  workflow_dispatch: {}   # allow manual runs from the Actions tab

# Prevent concurrent runs from racing on the same commit.
# cancel-in-progress: false means a second trigger queues rather than kills the first.
concurrency:
  group: update-tournament
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Run updater
        env:
          FOOTBALL_DATA_TOKEN: ${{ secrets.FOOTBALL_DATA_TOKEN }}
          WC_COMPETITION: "WC"   # football-data.org FIFA World Cup code
          WC_SEASON: "2026"
          DAILY_CALL_CAP: "95"
          # Free-access cutoff (ISO-8601 UTC). While now < this, live/share is
          # free for everyone; after it, premium/VIP only. Edit to change remotely.
          FREE_UNTIL: "2026-06-17T23:59:59Z"
        # Loop 4× with 30-second gaps (~2 min total per job).
        # With two cron entries offset by 2 min, jobs interleave without queuing:
        #   :00 job polls at :00, :30, :01, :01:30
        #   :02 job polls at :02, :02:30, :03, :03:30
        # Net: feed updated roughly every 30 seconds across the full 5-min window.
        run: |
          for i in 1 2 3 4; do
            node scripts/update_tournament.mjs
            if [ $i -lt 4 ]; then sleep 30; fi
          done

      - name: Commit changes
        run: |
          if [[ -n "$(git status --porcelain tournament2026.json scripts/.tournament-state.json)" ]]; then
            git config user.name "tournament-bot"
            git config user.email "bot@users.noreply.github.com"
            git add tournament2026.json scripts/.tournament-state.json
            git commit -m "chore: update live tournament feed [skip ci]"
            git push
            # Purge jsDelivr's CDN cache so apps see the update within minutes
            # instead of waiting out the ~12h @main branch cache.
            curl -sf "https://purge.jsdelivr.net/gh/${GITHUB_REPOSITORY}@main/tournament2026.json" \
              && echo "Purged jsDelivr cache." || echo "jsDelivr purge failed (non-fatal)."
          else
            echo "No changes to commit."
          fi
